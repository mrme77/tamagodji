[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamagodji"
version = "0.1.0"
description = "A small, hardware-friendly virtual pet for Raspberry Pi."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tamagodji = "tamagodji.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

